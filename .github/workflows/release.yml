name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Configure Release Signing
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Release signing secrets are missing in GitHub repository settings!"
            echo "The release workflow requires SIGNING_KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD to be configured."
            exit 1
          fi

          mkdir -p /tmp/devshield-signing
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > /tmp/devshield-signing/devshield-release.jks

          cat << EOF > keystore.properties
          DEVSHIELD_STORE_FILE=/tmp/devshield-signing/devshield-release.jks
          DEVSHIELD_STORE_PASSWORD=$KEYSTORE_PASSWORD
          DEVSHIELD_KEY_ALIAS=$KEY_ALIAS
          DEVSHIELD_KEY_PASSWORD=$KEY_PASSWORD
          EOF

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Package Release Artifacts
        run: |
          mkdir -p release-artifacts
          OUTPUT_APK="release-artifacts/DevShield-${{ github.ref_name }}.apk"
          
          # Copy the release-signed APK produced by Gradle
          cp app/build/outputs/apk/release/app-release.apk "$OUTPUT_APK"

          # Immediately shred and remove temporary signing credentials
          rm -rf /tmp/devshield-signing keystore.properties

          # Generate SHA-256 checksum for the release artifact
          cd release-artifacts
          shasum -a 256 "DevShield-${{ github.ref_name }}.apk" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/DevShield-${{ github.ref_name }}.apk
            release-artifacts/checksums.txt
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
