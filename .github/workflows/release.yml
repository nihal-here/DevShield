name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APK
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Package Single Installable Release APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p release-artifacts
          OUTPUT_APK="release-artifacts/DevShield-${{ github.ref_name }}.apk"

          if [ -n "$SIGNING_KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "Release signing credentials detected. Signing release build with production keystore..."
            echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            
            # Find apksigner from Android SDK
            APKSIGNER=$(find $ANDROID_SDK_ROOT/build-tools -name apksigner | sort -V | tail -n 1)
            $APKSIGNER sign --ks /tmp/release.keystore \
              --ks-pass pass:"$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass pass:"$KEY_PASSWORD" \
              --out "$OUTPUT_APK" \
              app/build/outputs/apk/release/app-release-unsigned.apk
            
            rm -f /tmp/release.keystore
            echo "Successfully signed release APK."
          else
            echo "No repository signing secrets configured. Packaging signed installable APK..."
            # app-debug.apk is signed with standard Android debug keystore and directly installable on devices
            cp app/build/outputs/apk/debug/app-debug.apk "$OUTPUT_APK"
          fi

          # Generate SHA-256 checksum for the release artifact
          cd release-artifacts
          shasum -a 256 "DevShield-${{ github.ref_name }}.apk" > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/DevShield-${{ github.ref_name }}.apk
            release-artifacts/checksums.txt
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: false
