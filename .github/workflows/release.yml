name: Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon

      - name: Prepare Artifacts
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/DevShield-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/DevShield-${{ github.ref_name }}-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/DevShield-${{ github.ref_name }}-release-unsigned.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
